name: lyric_practice_app
description: "App de reconocimiento musical, letras y práctica con IA"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0

  # Audio
  just_audio: ^0.9.42

  # Environment
  flutter_dotenv: ^5.2.1

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

  # Utils
  equatable: ^2.0.7
  dartz: ^0.10.1
  get_it: ^8.0.2
  shared_preferences: ^2.3.4
  uuid: ^4.5.1
  logger: ^2.5.0
  permission_handler: ^11.3.1
  record: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/
    - assets/images/
    - assets/animations/
